<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="My Tasks"
    >

    <title>My Tasks</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="app-header">

            <div class="header-image"></div>

            <div class="header-content">

                <div class="logo-container">

                    <img
                        src="images/logo.jpg"
                        alt="Logo"
                        class="logo"
                    >

                </div>

                <div>

                    <h1>Barvao Yesuf !</h1>

                    <p>
                        Organize your day :)
                    </p>

                </div>

            </div>

        </header>


        <!-- =========================
             CALENDAR
        ========================== -->

        <section class="calendar-card">

            <div class="calendar-title">

                <button
                    id="previousMonth"
                    class="month-button"
                >
                    ‹
                </button>

                <h2 id="monthYear"></h2>

                <button
                    id="nextMonth"
                    class="month-button"
                >
                    ›
                </button>

            </div>


            <div class="weekdays">

                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>

            </div>


            <div
                id="calendar"
                class="calendar"
            ></div>

        </section>


        <!-- =========================
             TASK AREA
        ========================== -->

        <main class="task-area">

            <div class="task-heading">

                <div>

                    <small>
                        Tasks for
                    </small>

                    <h2 id="selectedDate"></h2>

                </div>

                <div
                    id="taskCount"
                    class="task-count"
                >
                    0
                </div>

            </div>


            <!-- =========================
                 ADD TASK
            ========================== -->

            <div class="add-task">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button
                    id="addTaskButton"
                    type="button"
                >
                    +
                </button>

            </div>


            <div class="drag-help">
                ☰ Hold and drag to reorder
            </div>


            <!-- =========================
                 TASK LIST
            ========================== -->

            <div
                id="taskList"
                class="task-list"
            ></div>


            <!-- =========================
                 DELETE COMPLETED
            ========================== -->

            <button
                id="deleteCompleted"
                class="delete-completed"
            >
                Delete Completed Tasks
            </button>

        </main>


        <!-- =========================
             BOTTOM NAV
        ========================== -->

        <nav class="bottom-nav">

            <button
                id="todayButton"
                class="nav-button active"
            >

                <span>⌂</span>

                <small>
                    Today
                </small>

            </button>


            <button
                id="calendarButton"
                class="nav-button"
            >

                <span>▣</span>

                <small>
                    Calendar
                </small>

            </button>


            <button
                id="taskButton"
                class="nav-button"
            >

                <span>✓</span>

                <small>
                    Tasks
                </small>

            </button>

        </nav>


    </div>


    <script src="script.js"></script>

</body>

</html>
